<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Fond sombre élégant -->
  <rect width="120" height="120" rx="26" fill="#121212"/>
  
  <!-- Carré emblématique Orange (#FF7900) -->
  <rect x="22" y="22" width="76" height="76" rx="16" fill="#ff7900"/>
  
  <!-- Symbole Orange Money : Cercles entrelacés / Monnaie dynamique -->
  <circle cx="50" cy="54" r="16" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="70" cy="54" r="16" fill="none" stroke="#000000" stroke-width="6"/>
  
  <!-- Texte officiel 'orange' et 'money' -->
  <text x="60" y="85" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="0.5">MONEY</text>
</svg>
